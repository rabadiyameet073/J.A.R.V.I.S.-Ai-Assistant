<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="1" />
      <stop offset="60%" stop-color="#0089A8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.2" />
  <!-- Outer dashed ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#00D4FF" stroke-width="2.5" stroke-dasharray="6, 4" stroke-opacity="0.8" />
  <!-- Inner ring -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-opacity="0.5" />
  <!-- Center Glow -->
  <circle cx="50" cy="50" r="22" fill="url(#glow)" />
  <!-- Core element -->
  <circle cx="50" cy="50" r="8" fill="#FFFFFF" />
  <!-- Sci-fi crosshairs -->
  <path d="M 50 15 L 50 25 M 50 75 L 50 85 M 15 50 L 25 50 M 75 50 L 85 50" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
</svg>
